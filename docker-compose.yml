services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: sn-postgres
    environment:
      POSTGRES_DB: smartnotebook
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: notebook_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d smartnotebook"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama removed - use native installation for Metal GPU acceleration
  # Install: brew install ollama && ollama serve
  # Performance: 27s (Docker/CPU) → 1-2s (Native/Metal GPU)

volumes:
  postgres_data:
