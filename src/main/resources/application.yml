spring:
  application:
    name: smart-notebook
  profiles:
    active: local
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/smartnotebook
    username: notebook
    password: notebook_dev
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  docker:
    compose:
      lifecycle-management: start-and-stop   # stop containers on shutdown, don't remove them
      stop:
        command: stop                         # 'stop' preserves containers + volumes; 'down' removes containers
        timeout: 30s                          # graceful shutdown wait before SIGKILL

# Application config
app:
  upload-dir: ${user.dir}/uploads

  query:
    default-top-k: 5
    max-top-k: 20

  chat:
    history-window: 10  # Number of recent messages to include in RAG context

# Ollama config
  models:
    default-extraction-model: ${EXTRACTION_MODEL:tinyllama}
    default-embedding-model: ${EMBEDDING_MODEL:all-minilm}
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      enabled: true
    openai:
      api-key: ${OPENAI_API_KEY:}
      enabled: true
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      enabled: true
    google:
      api-key: ${GEMINI_API_KEY:}
      enabled: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.sirohi.smartnotebook: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO
